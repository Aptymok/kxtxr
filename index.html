<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>KXTXR · GRIMOIRE</title>
  <meta name="description" content="A signal persists long enough to remember what it was, transform without disappearing, and return carrying evidence of its own passage.">
  <meta property="og:title" content="KXTXR · GRIMOIRE">
  <meta property="og:description" content="A signal persists long enough to remember what it was, transform without disappearing, and return carrying evidence of its own passage.">
  <meta name="theme-color" content="#030201">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "CreativeWork",
    "name": "KXTXR — THE WOUND THAT LEARNED TO RETURN",
    "creator": { "@type": "Organization", "name": "KXTXR" },
    "description": "A signal persists long enough to remember what it was, transform without disappearing, and return carrying evidence of its own passage."
  }
  </script>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/rune-constellation.css">
  <link rel="stylesheet" href="/responsive-background.css">
  <link rel="stylesheet" href="/kxtxr-control-room.css">
  <link rel="stylesheet" href="/desktop-intro.css">
</head>
<body>
<div class="kx-intro" id="kxIntro" data-state="logo" aria-label="Choose KXTXR entry path">
  <div class="kx-intro-bg" aria-hidden="true"></div>
  <div class="kx-intro-film" aria-hidden="true"></div>
  <main class="kx-intro-center">
    <div class="kx-intro-logo" aria-label="KXTXR">KXTXR</div>
    <div class="kx-intro-choices" aria-label="KXTXR entrance choice">
      <button class="kx-intro-choice" type="button" data-kx-entry="notes">
        <span class="kx-intro-index">01</span>
        <span class="kx-intro-label">KXTXR LONGITUDINAL NOTES<br>AND EVIDENCE GATHERING</span>
      </button>
      <span class="kx-intro-or" aria-hidden="true">OR</span>
      <button class="kx-intro-choice" type="button" data-kx-entry="artist">
        <span class="kx-intro-index">02</span>
        <span class="kx-intro-label">KXTXR THE ARTIST TO BE<br>THAT ALREADY WAS</span>
      </button>
    </div>
  </main>
</div>

<div class="kxtxr-scene" id="scene">
  <div class="scene-bg" aria-hidden="true"></div>

  <div class="ambient-hologram" aria-hidden="true">
    <div class="scanlines"></div>
    <div class="noise"></div>
    <svg class="ghost-runes" id="ghostRunes" viewBox="0 0 1000 1800" preserveAspectRatio="none"></svg>
  </div>

  <div class="hud" aria-hidden="true">
    <div class="hud-title">KXTXR</div>
    <div class="hud-recovery">BARRA DE RECOVERY TOTAL&nbsp;&nbsp;[████████████████████]</div>
  </div>

  <div class="operative-field">
    <div class="projection-beam" id="projectionBeam" aria-hidden="true"></div>

    <div class="core-system" id="coreSystem">
      <div class="core-circle">
        <div class="core-ring core-ring-1"></div>
        <div class="core-ring core-ring-2"></div>
        <div class="core-ring core-ring-3"></div>
        <div class="core-crosshair"></div>
        <div class="core-active-rune" id="coreActiveRune"></div>
      </div>
      <div class="core-state" id="coreState">RETURN · ACTIVE</div>
    </div>

    <nav class="rune-orbit" id="runeOrbit" aria-label="KXTXR layers"></nav>

    <section class="projection-screen" id="projectionScreen" aria-hidden="true">
      <div class="projection-frame" aria-hidden="true"></div>
      <header class="projection-header">
        <div>
          <div class="projection-layer-name" id="pLayerName"></div>
          <div class="projection-layer-subtitle" id="pLayerSubtitle"></div>
        </div>
        <div class="projection-status" id="pStatus"></div>
      </header>

      <main class="projection-body">
        <aside class="projection-fragments-left" id="pFragLeft"></aside>
        <div class="projection-visual-main" id="pMain"></div>
        <aside class="projection-fragments-right" id="pFragRight"></aside>
        <div class="projection-visual-secondary" id="pSecondary"></div>
      </main>

      <footer class="projection-footer">
        <div id="pMetaSource"></div>
        <div id="pMetaMode"></div>
        <div id="pMetaIntegrity"></div>
      </footer>
    </section>
  </div>

  <div class="crt-noise" aria-hidden="true"></div>
  <div class="crt-roll" aria-hidden="true"></div>
  <div class="crt-jitter" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
</div>

<script src="/canon.js"></script>
<script src="/app.js"></script>
<script src="/rune-constellation.js"></script>
<script src="/runic-neural-graph.js"></script>
<script src="/desktop-intro.js"></script>
</body>
</html>
