<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050306">
  <meta name="color-scheme" content="dark">
  <title>KXTXR · THE ARTIST</title>
  <meta name="description" content="KXTXR · a scroll-directed cinematic narrative. The scene persists while the signal transforms.">
  <link rel="stylesheet" href="/artist/artist-cinematic.css">
</head>
<body>
  <main class="kx-cinema" id="kxCinema" aria-label="KXTXR cinematic artist narrative">
    <section class="kx-stage" id="kxStage" data-chapter="entry">
      <div class="kx-world" aria-hidden="true">
        <picture class="kx-layer kx-plate kx-room" data-layer="room">
          <source media="(max-width:600px)" srcset="/assets/kxtxr/kxtxr-bg-mobile.webp">
          <source media="(min-width:601px) and (max-width:1180px) and (orientation:portrait)" srcset="/assets/kxtxr/kxtxr-bg-tablet-portrait.webp">
          <source media="(min-width:601px) and (max-width:1180px) and (orientation:landscape)" srcset="/assets/kxtxr/kxtxr-bg-tablet-landscape.webp">
          <img src="/assets/kxtxr/kxtxr-bg-desktop.webp" alt="">
        </picture>
        <div class="kx-layer kx-plate kx-plate-awake" data-layer="awakePlate"><img src="/assets/cinematic/scene-01-awake.webp" alt=""></div>
        <div class="kx-layer kx-plate kx-plate-signal" data-layer="signalPlate"><img src="/assets/cinematic/scene-03-lift.webp" alt=""></div>
        <div class="kx-layer kx-plate kx-plate-assembly" data-layer="assemblyPlate"><img src="/assets/cinematic/scene-04-open.webp" alt=""></div>
        <div class="kx-layer kx-plate kx-plate-producer" data-layer="producerPlate"><img src="/assets/cinematic/scene-05-dashboard.webp" alt=""></div>
        <video class="kx-layer kx-field-video" data-layer="fieldA" src="/assets/stairwell-shadow-021.mp4" muted loop playsinline preload="metadata"></video>
        <video class="kx-layer kx-field-video" data-layer="fieldB" src="/assets/traffic-white-112.mp4" muted loop playsinline preload="metadata"></video>
        <div class="kx-layer kx-character kx-character-origin" data-layer="actorOrigin"><img src="/assets/cinematic/scene-01-awake.webp" alt=""></div>
        <div class="kx-layer kx-character kx-character-signal" data-layer="actorSignal"><img src="/assets/cinematic/scene-03-lift.webp" alt=""></div>
        <div class="kx-layer kx-character kx-character-kxtxr" data-layer="actorKxtxr"><img src="/assets/cinematic/scene-05-dashboard.webp" alt=""></div>
        <div class="kx-layer kx-character kx-character-performance" data-layer="actorPerformance"><img src="/assets/cinematic/scene-04-open.webp" alt=""></div>
        <div class="kx-layer kx-rug" data-layer="rug"><img src="/artist/assets/performance-rug.svg" alt=""></div>
        <div class="kx-layer kx-rem618" data-layer="rem618"><span class="kx-rem-index">618</span><span class="kx-rem-name">REM</span><i></i><i></i><i></i><small>persistent carrier</small></div>
        <div class="kx-layer kx-mark" data-layer="mark">KXTXR</div>
        <div class="kx-layer kx-111" data-layer="oneEleven">111</div>
        <div class="kx-depth-grid"></div><div class="kx-scan"></div><div class="kx-grain"></div><div class="kx-vignette"></div>
      </div>
      <header class="kx-chrome">
        <a class="kx-back" href="/" aria-label="Return to KXTXR Grimoire">KXTXR / GRIMOIRE</a>
        <div class="kx-system-state"><span id="kxChapterCode">00</span><i></i><span id="kxChapterLabel">ENTRY</span></div>
        <button class="kx-sound is-muted" id="kxSound" type="button" aria-label="Play or pause 111"><span></span><span></span><span></span><span></span></button>
      </header>
      <div class="kx-narrative" id="kxNarrative" data-align="center">
        <p class="kx-kicker" id="kxKicker">THE ARTIST TO BE THAT ALREADY WAS</p>
        <h1 id="kxTitle">KXTXR</h1>
        <p class="kx-copy" id="kxCopy">Scroll does not open pages. It changes the state of the same world.</p>
      </div>
      <div class="kx-side-index" aria-hidden="true" id="kxSideIndex"></div>
      <div class="kx-scroll-cue" id="kxScrollCue" aria-hidden="true"><span>SCROLL TO TRANSFORM</span><i></i></div>
      <nav class="kx-network" id="kxNetwork" aria-label="KXTXR active carriers">
        <a href="#" data-network="SPOTIFY">SPOTIFY</a><a href="#" data-network="YOUTUBE">YOUTUBE</a><a href="#" data-network="INSTAGRAM">INSTAGRAM</a><a href="#" data-network="TIKTOK">TIKTOK</a><a href="/" data-network="WEBSITE">GRIMOIRE</a>
      </nav>
      <div class="kx-progress" aria-hidden="true"><i id="kxProgress"></i></div>
    </section>
    <div class="kx-track" id="kxTrack" aria-hidden="true">
      <section data-chapter="entry" style="--span:170"></section><section data-chapter="origin" style="--span:230"></section><section data-chapter="signal" style="--span:260"></section><section data-chapter="assembly" style="--span:280"></section><section data-chapter="kxtxr" style="--span:300"></section><section data-chapter="111" style="--span:330"></section><section data-chapter="performance" style="--span:330"></section><section data-chapter="field" style="--span:300"></section><section data-chapter="return" style="--span:280"></section><section data-chapter="resolution" style="--span:230"></section>
    </div>
  </main>
  <audio id="kx111Audio" preload="metadata" playsinline></audio>
  <script src="/artist/111-cues.js"></script><script src="/artist/scene-manifest.js"></script><script src="/artist/artist-cinematic.js" defer></script>
</body>
</html>
