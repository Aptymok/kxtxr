<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050409">
  <title>KXTXR · THE ARTIST</title>
  <meta name="description" content="KXTXR · The Artist. A scroll-assembled visual signal.">
  <link rel="stylesheet" href="/artist/artist-scroll.css">
  <link rel="stylesheet" href="/artist/artist-sprites.css">
</head>
<body>
  <main class="kx-artist" id="kxArtist" aria-label="KXTXR artist scroll experience">
    <div class="kx-stage" id="kxStage">
      <div class="kx-bg kx-bg-room" data-bg="room" aria-hidden="true"></div>
      <div class="kx-bg kx-bg-studio" data-bg="studio" aria-hidden="true"></div>
      <div class="kx-bg kx-bg-stage" data-bg="stage" aria-hidden="true"></div>
      <div class="kx-bg kx-bg-kaiju" data-bg="kaiju" aria-hidden="true"></div>
      <div class="kx-colorwash" aria-hidden="true"></div>
      <div class="kx-halftone" aria-hidden="true"></div>
      <div class="kx-speedlines" id="kxSpeedlines" aria-hidden="true"></div>

      <div class="kx-layerfield" id="kxLayerfield" aria-hidden="true"></div>
      <div class="kx-fxfield" id="kxFxfield" aria-hidden="true"></div>

      <div class="kx-network" id="kxNetwork" aria-label="KXTXR network">
        <a data-network="SPOTIFY" target="_blank" rel="noopener noreferrer">SPOTIFY</a>
        <a data-network="APPLE MUSIC" target="_blank" rel="noopener noreferrer">APPLE MUSIC</a>
        <a data-network="AMAZON MUSIC" target="_blank" rel="noopener noreferrer">AMAZON MUSIC</a>
        <a data-network="YOUTUBE" target="_blank" rel="noopener noreferrer">YOUTUBE</a>
        <a data-network="TIKTOK" target="_blank" rel="noopener noreferrer">TIKTOK</a>
        <a data-network="INSTAGRAM" target="_blank" rel="noopener noreferrer">INSTAGRAM</a>
        <a data-network="WEBSITE" href="/" aria-label="KXTXR website">WEBSITE</a>
        <a data-network="EMAIL" aria-label="KXTXR email">CORREO ELECTRÓNICO</a>
      </div>

      <button class="kx-sound" id="kxSound" type="button" aria-label="Play 111 soundtrack" title="111 soundtrack">
        <span></span><span></span><span></span><span></span>
      </button>
      <a class="kx-return" href="/" aria-label="Return to KXTXR Grimoire">×</a>
      <div class="kx-progress" id="kxProgress" aria-hidden="true"><i></i></div>
    </div>

    <div class="kx-track" id="kxTrack" aria-hidden="true">
      <section data-scene="wake"></section>
      <section data-scene="signal"></section>
      <section data-scene="guitar"></section>
      <section data-scene="producer"></section>
      <section data-scene="energy"></section>
      <section data-scene="release"></section>
      <section data-scene="live"></section>
      <section data-scene="kaiju"></section>
      <section data-scene="network"></section>
    </div>
  </main>

  <audio id="kx111" preload="metadata" loop playsinline></audio>
  <script src="/artist/artist-scroll.js" defer></script>
</body>
</html>
