  </main>

  <script>
  (() => {
    'use strict';

    const SCHEDULE = Object.freeze({
      signal: '111',
      timezone: 'America/Mexico_City',
      activationAt: '2026-08-24T20:11:00-06:00',
      releaseAt: '2026-08-25T01:11:00-06:00',
      cycleMs: 60 * 60 * 1000,
      unitsPerCycle: 111
    });

    const activationMs = Date.parse(SCHEDULE.activationAt);
    const releaseMs = Date.parse(SCHEDULE.releaseAt);
    const totalDurationMs = releaseMs - activationMs;
    const totalCycles = Math.round(totalDurationMs / SCHEDULE.cycleMs);
    const unitMs = SCHEDULE.cycleMs / SCHEDULE.unitsPerCycle;

    const root = document.getElementById('kxLive');
    const params = new URLSearchParams(location.search);
    const view = params.get('view');
    if (view === 'obs' || view === 'clean') document.body.dataset.view = view;
    const viewMode = document.getElementById('kxViewMode');
    if (viewMode) viewMode.textContent = view ? `${view.toUpperCase()} FEED` : 'KXTXR';

    const targetLabel = new Intl.DateTimeFormat('en-GB', {
      timeZone: SCHEDULE.timezone,
      day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false
    }).format(new Date(releaseMs)).toUpperCase().replace(',', ' ·');

    const clockFormatter = new Intl.DateTimeFormat('en-GB', {
      timeZone: SCHEDULE.timezone,
      hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
    });

    const els = {
      stateCode: document.getElementById('kxStateCode'),
      stateLabel: document.getElementById('kxStateLabel'),
      svgPhase: document.getElementById('kxSvgPhase'),
      svgState: document.getElementById('kxSvgState'),
      svgValueBig: document.getElementById('kxSvgValueBig'),
      svgHeroValue: document.getElementById('kxSvgHeroValue'),
      svgRemaining: document.getElementById('kxSvgRemaining'),
      svgSignalState: document.getElementById('kxSvgSignalState'),
      svgTrace: document.getElementById('kxSvgTrace'),
      svgEngine: document.getElementById('kxSvgEngine'),
      svgCycleMeta: document.getElementById('kxSvgCycleMeta'),
      svgStateMeta: document.getElementById('kxSvgStateMeta'),
      svgTarget: document.getElementById('kxSvgTarget'),
      svgClock: document.getElementById('kxSvgClock'),
      svgClockSecondary: document.getElementById('kxSvgClockSecondary')
    };

    root.dataset.engine = 'synced';
    if (els.svgEngine) els.svgEngine.textContent = 'SYNCED';
    if (els.svgTarget) els.svgTarget.textContent = targetLabel;

    const pad = (value, width = 3) => String(Math.max(0, value)).padStart(width, '0');

    function formatDuration(ms) {
      const safe = Math.max(0, ms);
      const totalSeconds = Math.ceil(safe / 1000);
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      return `${pad(hours, 2)}:${pad(minutes, 2)}:${pad(seconds, 2)}`;
    }

    let pulseTimer = null;
    function pulse(kind) {
      root.classList.remove('is-step', 'is-cycle');
      void root.offsetWidth;
      root.classList.add(kind === 'cycle' ? 'is-cycle' : 'is-step');
      clearTimeout(pulseTimer);
      pulseTimer = setTimeout(() => root.classList.remove('is-step', 'is-cycle'), kind === 'cycle' ? 900 : 320);
    }

    function derive(now) {
      if (now < activationMs) {
        return {state:'standby',code:'PRE',label:'STANDBY',cycle:totalCycles,value:111,stateText:'PRE-RELEASE',signalState:'STANDBY',phase:`RETURN // CYCLE ${pad(totalCycles)}`,remaining:activationMs-now};
      }
      if (now >= releaseMs) {
        return {state:'released',code:'000',label:'RELEASED',cycle:0,value:111,stateText:'RELEASED',signalState:'RETURNED',phase:'RETURN COMPLETE',remaining:0};
      }

      const elapsed = now - activationMs;
      const completedCycles = Math.floor(elapsed / SCHEDULE.cycleMs);
      const cycle = Math.max(1, totalCycles - completedCycles);
      const withinCycle = elapsed % SCHEDULE.cycleMs;
      const completedUnits = Math.min(SCHEDULE.unitsPerCycle - 1, Math.floor(withinCycle / unitMs));
      const value = SCHEDULE.unitsPerCycle - completedUnits;
      const final = cycle === 1;

      return {
        state: final ? 'final' : 'active',
        code: pad(cycle),
        label: final ? 'FINAL CYCLE' : 'ACTIVE',
        cycle,
        value,
        stateText: final ? 'FINAL CYCLE' : 'PRE-RELEASE',
        signalState: 'ACTIVE',
        phase: final ? 'RETURN // FINAL CYCLE' : `RETURN // CYCLE ${pad(cycle)}`,
        remaining: releaseMs - now
      };
    }

    let lastCycle = null;
    let lastValue = null;

    function render() {
      const now = Date.now();
      const frame = derive(now);
      const cycleText = pad(frame.cycle);
      const valueText = pad(frame.value);
      const clockText = clockFormatter.format(new Date(now));

      root.dataset.state = frame.state;
      if (els.stateCode) els.stateCode.textContent = frame.code;
      if (els.stateLabel) els.stateLabel.textContent = frame.label;
      if (els.svgPhase) els.svgPhase.textContent = frame.phase;
      if (els.svgState) els.svgState.textContent = frame.stateText;
      if (els.svgValueBig) els.svgValueBig.textContent = valueText;
      if (els.svgHeroValue) els.svgHeroValue.textContent = valueText;
      if (els.svgRemaining) els.svgRemaining.textContent = formatDuration(frame.remaining);
      if (els.svgSignalState) els.svgSignalState.textContent = frame.signalState;
      if (els.svgTrace) els.svgTrace.textContent = `${cycleText} / ${valueText}`;
      if (els.svgCycleMeta) els.svgCycleMeta.textContent = cycleText;
      if (els.svgStateMeta) els.svgStateMeta.textContent = frame.stateText;
      if (els.svgClock) els.svgClock.textContent = clockText;
      if (els.svgClockSecondary) els.svgClockSecondary.textContent = clockText;

      const withinCycle = Math.max(0, (now - activationMs) % SCHEDULE.cycleMs);
      const withinUnit = Math.max(0, withinCycle % unitMs);
      root.style.setProperty('--unit-progress', String(Math.min(1, withinUnit / unitMs)));

      if (lastCycle !== null && frame.cycle !== lastCycle) pulse('cycle');
      else if (lastValue !== null && frame.value !== lastValue) pulse('step');
      lastCycle = frame.cycle;
      lastValue = frame.value;
    }

    render();
    setInterval(render, 200);
  })();
  </script>
