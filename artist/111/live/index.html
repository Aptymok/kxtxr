<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050306">
  <meta name="color-scheme" content="dark">
  <title>KXTXR · 111 / RETURN SEQUENCE</title>
  <meta name="description" content="KXTXR 111 live return sequence. A persistent cycle clock resolving at 01:11.">
  <link rel="stylesheet" href="/artist/111/live/live.css?v=20260824-2011">
</head>
<body>
  <main class="kx-live" id="kxLive" data-state="standby" data-engine="booting">
    <div class="kx-live__grid" aria-hidden="true"></div>
    <div class="kx-live__scan" aria-hidden="true"></div>
    <div class="kx-live__grain" aria-hidden="true"></div>
    <div class="kx-live__vignette" aria-hidden="true"></div>
    <div class="kx-live__flash" id="kxFlash" aria-hidden="true"></div>

    <header class="kx-live__chrome">
      <a class="kx-live__back" href="/artist">KXTXR / ARTIST</a>
      <div class="kx-live__state"><span id="kxStateCode">PRE</span><i></i><span id="kxStateLabel">STANDBY</span></div>
      <div class="kx-live__mode" id="kxViewMode">LIVE SIGNAL</div>
    </header>

    <section class="kx-live__stage" aria-labelledby="kxSignalValue">
      <p class="kx-live__micro">KXTXR PICTURES · SIGNAL HOUSE · 111</p>

      <div class="kx-live__cycle-block">
        <span>CYCLE</span>
        <b id="kxCycle">005</b>
      </div>

      <div class="kx-live__leader" id="kxLeader" aria-label="111 countdown">
        <div class="kx-live__leader-ring">
          <i></i><i></i><i></i>
          <b id="kxSignalValue">111</b>
        </div>
      </div>

      <div class="kx-live__copy">
        <p id="kxPhase">RETURN SEQUENCE</p>
        <strong id="kxTarget">25 AUG 2026 · 01:11</strong>
      </div>
    </section>

    <aside class="kx-live__trace" aria-label="Signal trace">
      <div><span>SIGNAL</span><b id="kxSignalState">STANDBY</b></div>
      <div><span>STATE</span><b id="kxState">PRE-RELEASE</b></div>
      <div><span>TRACE</span><b id="kxTrace">005 / 111</b></div>
      <div><span>REMAINING</span><b id="kxRemaining">05:00:00</b></div>
      <div><span>ENGINE</span><b id="kxEngine">BOOTING</b></div>
      <div><span>TARGET</span><b>2026.08.25 / 01:11:00</b></div>
    </aside>

    <div class="kx-live__ticks" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
    </div>

    <footer class="kx-live__footer">
      <span>RETURN TRANSMISSION</span>
      <span id="kxClock">--:--:--</span>
      <span>PRINT 618 / OBJECT 111</span>
    </footer>
  </main>

  <script>
  (() => {
    'use strict';

    const SCHEDULE = Object.freeze({
      signal: '111',
      timezone: 'America/Mexico_City',
      activationAt: '2026-08-24T20:11:00-06:00',
      releaseAt: '2026-08-25T01:11:00-06:00',
      cycleMs: 60 * 60 * 1000,
      unitsPerCycle: 111
    });

    const activationMs = Date.parse(SCHEDULE.activationAt);
    const releaseMs = Date.parse(SCHEDULE.releaseAt);
    const totalDurationMs = releaseMs - activationMs;
    const totalCycles = Math.round(totalDurationMs / SCHEDULE.cycleMs);
    const unitMs = SCHEDULE.cycleMs / SCHEDULE.unitsPerCycle;

    const root = document.getElementById('kxLive');
    const cycleEl = document.getElementById('kxCycle');
    const valueEl = document.getElementById('kxSignalValue');
    const phaseEl = document.getElementById('kxPhase');
    const targetEl = document.getElementById('kxTarget');
    const signalStateEl = document.getElementById('kxSignalState');
    const stateEl = document.getElementById('kxState');
    const traceEl = document.getElementById('kxTrace');
    const remainingEl = document.getElementById('kxRemaining');
    const clockEl = document.getElementById('kxClock');
    const stateCodeEl = document.getElementById('kxStateCode');
    const stateLabelEl = document.getElementById('kxStateLabel');
    const viewModeEl = document.getElementById('kxViewMode');
    const engineEl = document.getElementById('kxEngine');

    const params = new URLSearchParams(location.search);
    const view = params.get('view');
    if (view === 'obs' || view === 'clean') document.body.dataset.view = view;
    if (viewModeEl && view) viewModeEl.textContent = `${view.toUpperCase()} FEED`;

    const canonicalClock = new Intl.DateTimeFormat('en-GB', {
      timeZone: SCHEDULE.timezone,
      hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
    });

    const targetLabel = new Intl.DateTimeFormat('en-GB', {
      timeZone: SCHEDULE.timezone,
      day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false
    }).format(new Date(releaseMs)).toUpperCase().replace(',', ' ·');

    if (targetEl) targetEl.textContent = targetLabel;
    root.dataset.engine = 'synced';
    engineEl.textContent = 'SYNCED';

    let lastCycle = null;
    let lastValue = null;
    let pulseTimer = null;

    const pad = (number, width = 3) => String(Math.max(0, number)).padStart(width, '0');

    function formatDuration(ms) {
      const safe = Math.max(0, ms);
      const totalSeconds = Math.ceil(safe / 1000);
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      return `${pad(hours, 2)}:${pad(minutes, 2)}:${pad(seconds, 2)}`;
    }

    function pulse(kind) {
      root.classList.remove('is-step', 'is-cycle');
      void root.offsetWidth;
      root.classList.add(kind === 'cycle' ? 'is-cycle' : 'is-step');
      clearTimeout(pulseTimer);
      pulseTimer = setTimeout(() => root.classList.remove('is-step', 'is-cycle'), kind === 'cycle' ? 1050 : 420);
    }

    function derive(now) {
      if (now < activationMs) {
        return {state:'standby',code:'PRE',label:'STANDBY',cycle:totalCycles,value:111,signalState:'STANDBY',stateText:'PRE-RELEASE',phase:'RETURN SEQUENCE / STANDBY',remaining:activationMs-now};
      }
      if (now >= releaseMs) {
        return {state:'released',code:'000',label:'RELEASED',cycle:0,value:111,signalState:'RETURNED',stateText:'RELEASED',phase:'RETURN COMPLETE',remaining:0};
      }

      const elapsed = now - activationMs;
      const completedCycles = Math.floor(elapsed / SCHEDULE.cycleMs);
      const cycle = Math.max(1, totalCycles - completedCycles);
      const withinCycle = elapsed % SCHEDULE.cycleMs;
      const completedUnits = Math.min(SCHEDULE.unitsPerCycle - 1, Math.floor(withinCycle / unitMs));
      const value = SCHEDULE.unitsPerCycle - completedUnits;
      const final = cycle === 1;

      return {
        state: final ? 'final' : 'active',
        code: pad(cycle),
        label: final ? 'FINAL CYCLE' : 'ACTIVE',
        cycle,
        value,
        signalState:'ACTIVE',
        stateText: final ? 'FINAL CYCLE' : 'PRE-RELEASE',
        phase: final ? 'FINAL RETURN SEQUENCE' : 'RETURN SEQUENCE',
        remaining: releaseMs-now
      };
    }

    function render() {
      const now = Date.now();
      const frame = derive(now);
      root.dataset.state = frame.state;
      cycleEl.textContent = pad(frame.cycle);
      valueEl.textContent = pad(frame.value);
      phaseEl.textContent = frame.phase;
      signalStateEl.textContent = frame.signalState;
      stateEl.textContent = frame.stateText;
      traceEl.textContent = `${pad(frame.cycle)} / ${pad(frame.value)}`;
      remainingEl.textContent = formatDuration(frame.remaining);
      clockEl.textContent = canonicalClock.format(new Date(now));
      stateCodeEl.textContent = frame.code;
      stateLabelEl.textContent = frame.label;

      const withinCycle = Math.max(0, (now - activationMs) % SCHEDULE.cycleMs);
      const withinUnit = Math.max(0, withinCycle % unitMs);
      root.style.setProperty('--unit-progress', String(Math.min(1, withinUnit / unitMs)));

      if (lastCycle !== null && frame.cycle !== lastCycle) pulse('cycle');
      else if (lastValue !== null && frame.value !== lastValue) pulse('step');
      lastCycle = frame.cycle;
      lastValue = frame.value;
    }

    render();
    setInterval(render, 200);
  })();
  </script>
</body>
</html>
