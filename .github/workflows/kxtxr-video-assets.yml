name: Assemble KXTXR signal film

on:
  push:
    branches:
      - feat/artist-scroll-film-kxtxr-video
    paths:
      - '.kx-assets/**'
      - '.github/workflows/kxtxr-video-assets.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/artist-scroll-film-kxtxr-video
          fetch-depth: 0

      - name: Unpack complete visual corpus and film runtime
        shell: bash
        run: |
          set -euo pipefail
          test -f .kx-assets/kxtxr-video-assets.tar.gz
          cat .kx-assets/kxtxr-code.part*.b64 | base64 -d > /tmp/kxtxr-code.tar.gz
          tar -xzf /tmp/kxtxr-code.tar.gz -C .
          tar -xzf .kx-assets/kxtxr-video-assets.tar.gz -C .
          test -f artist/index.html
          test -f artist/artist-cinematic.js
          test -f assets/kxtxr-video/corpus-manifest.json
          test -f assets/kxtxr-video/audio/111-cinematic.mp3
          count="$(find assets/kxtxr-video/corpus -maxdepth 1 -type f -name '*.webp' | wc -l | tr -d ' ')"
          test "$count" = "65"
          rm -rf .kx-assets

      - name: Validate runtime syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check artist/artist-cinematic.js
          node --check artist/scene-manifest.js

      - name: Commit assembled experience
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artist assets/kxtxr-video .kx-assets
          if git diff --cached --quiet; then
            echo "No assembled changes to commit."
            exit 0
          fi
          git commit -m "Assemble KXTXR signal film, visual corpus and sticker shop"
          git push origin HEAD:feat/artist-scroll-film-kxtxr-video
